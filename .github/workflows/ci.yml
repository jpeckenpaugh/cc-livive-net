name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: cc-livive-dev:latest
          cache-from: type=gha,scope=cc-dev
          cache-to: type=gha,mode=max,scope=cc-dev
      - name: Prepare cache volumes
        run: |
          docker volume create cc-livive-cargo
          docker volume create cc-livive-target
          docker run --rm -u 0 \
            -v cc-livive-cargo:/cargo \
            -v cc-livive-target:/work/target \
            cc-livive-dev:latest chown -R "$(id -u):$(id -g)" /cargo /work/target
      - name: Cache tables
        uses: actions/cache@v4
        with:
          path: tables
          key: tables-v1-${{ hashFiles('crates/color-cube-solver/src/**', 'crates/color-cube/src/**', 'Cargo.lock') }}
      - name: Generate tables if missing
        run: |
          if [ ! -f tables/cc-tables-v1.bin ] || [ ! -f tables/cc-thistlethwaite-v1.bin ]; then
            ./scripts/gen-tables.sh
          fi
      - name: fmt, clippy, no_std, tests
        run: ./scripts/docker.sh check

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: cc-livive-dev:latest
          cache-from: type=gha,scope=cc-dev
          cache-to: type=gha,mode=max,scope=cc-dev
      - name: Prepare cache volumes
        run: |
          docker volume create cc-livive-cargo
          docker volume create cc-livive-target
          docker run --rm -u 0 \
            -v cc-livive-cargo:/cargo \
            -v cc-livive-target:/work/target \
            cc-livive-dev:latest chown -R "$(id -u):$(id -g)" /cargo /work/target
      - name: Cache tables
        uses: actions/cache@v4
        with:
          path: tables
          key: tables-v1-${{ hashFiles('crates/color-cube-solver/src/**', 'crates/color-cube/src/**', 'Cargo.lock') }}
      - name: Generate tables if missing
        run: |
          if [ ! -f tables/cc-tables-v1.bin ] || [ ! -f tables/cc-thistlethwaite-v1.bin ]; then
            ./scripts/gen-tables.sh
          fi
      - name: Build wasm (web)
        run: ./scripts/docker.sh wasm-pack build crates/color-cube-wasm --target web --release --out-dir ../../web/pkg
      - name: Build wasm (nodejs)
        run: ./scripts/docker.sh wasm-pack build crates/color-cube-wasm --target nodejs --release --out-dir ../../web/pkg-node
      - name: Node smoke
        run: ./scripts/docker.sh node scripts/smoke.mjs
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: web/pkg
          if-no-files-found: error
          retention-days: 7

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: cc-livive-dev:latest
          cache-from: type=gha,scope=cc-dev
          cache-to: type=gha,mode=max,scope=cc-dev
      - name: Build browser image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.browser
          load: true
          tags: cc-livive-browser:latest
          cache-from: type=gha,scope=cc-browser
          cache-to: type=gha,mode=max,scope=cc-browser
      - name: Prepare cache volumes
        run: |
          docker volume create cc-livive-cargo
          docker volume create cc-livive-target
          docker run --rm -u 0 \
            -v cc-livive-cargo:/cargo \
            -v cc-livive-target:/work/target \
            cc-livive-dev:latest chown -R "$(id -u):$(id -g)" /cargo /work/target
      - name: Cache tables
        uses: actions/cache@v4
        with:
          path: tables
          key: tables-v1-${{ hashFiles('crates/color-cube-solver/src/**', 'crates/color-cube/src/**', 'Cargo.lock') }}
      - name: Generate tables if missing
        run: |
          if [ ! -f tables/cc-tables-v1.bin ] || [ ! -f tables/cc-thistlethwaite-v1.bin ]; then
            ./scripts/gen-tables.sh
          fi
      - name: Build wasm (web)
        run: ./scripts/docker.sh wasm-pack build crates/color-cube-wasm --target web --release --out-dir ../../web/pkg
      - name: Browser smoke
        run: ./scripts/browser-smoke.sh
      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
